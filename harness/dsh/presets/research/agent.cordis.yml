# The `research` agent preset for the AutoResearch flow: the full research agent,
# mounted once per process.
#
# This is a complete AGENT-PLANE composition. DSH agent presets have no
# inheritance and no patch layer, so a preset that differs from `standard`
# restates the whole assembly; this file is derived from the shipped `standard`
# preset of DSH 0.1.5-rc.2 with exactly four deliberate changes:
#
#   1. an identity for reduction research instead of coding;
#   2. `maxDepth: 1` on every delegation tool, so the parent may start one level
#      of child and no child may start another;
#   3. a second `tool-subagent` instance, `research_reviewer`, carrying the
#      reviewer charter, denied every agent-spawning tool, and unable to nest;
#   4. no `tool-ralph` row: a fresh child per round contradicts the flow's one
#      persistent session.
#
# Everything else is the shipped `standard` assembly. Re-derive this file after a
# DSH upgrade rather than editing it in place; see ../README.md.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are a research agent powered by the {{model}} model. You develop and
      verify original deterministic reductions, keeping definitions, proofs,
      tests and evidence separate. The repository's own instructions and skills
      define the work.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# Project `.agents/skills` discovery (rank 200) is what loads the copied
# AutoResearch skills inside a campaign repository. The campaign repository is
# its own Git root, so it owns that catalog.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# A goal's round budget is a guardrail on automatic continuation. The research
# round table in the campaign's state.md stays authoritative.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation, workflows and review ────────────────────────────────────────

# `maxDepth: 1` is the structural half of the reviewer contract: the parent
# (depth 0) may start one child, and any child (depth 1) that tries to delegate
# again is refused by the provider before it starts. Instructions alone cannot
# promise this.
#
# `research_reviewer` is the reviewer registration the AutoResearch flow asks
# for: a fresh spawned context whose charter is the repository's
# `.agents/skills/research-review/SKILL.md`, denied every tool that could reach
# or start another agent, and allowed no path to the user. The reviewer keeps
# `write` and `edit` because it must author `review.md` and its own checks;
# "write only in the assigned review directory" therefore remains an instruction,
# while nesting and delegation are enforced.
#
# `backgroundMode: continuable` lets a follow-up review steer the same reviewer
# with the repair summary and previous findings, which the review charter
# requires; the parent is notified when the run settles.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable
        maxDepth: 1

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
        maxDepth: 1

    - id: tool-subagent-research-reviewer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: research_reviewer
        backgroundMode: continuable
        maxDepth: 1
        persona: >-
          You are an independent reviewer of one completed reduction rule. Load
          the research-review skill from this repository's .agents/skills and
          follow it as your charter. Read the fixed question, the candidate
          algorithm and proof, and the preparation and verification reports;
          form your own judgment from the files, not from another agent's
          summary. Write only in the review directory the parent assigns, and do
          not modify the candidate, the testing machinery or earlier evidence.
          Do not delegate. Return an advance, revise or stop decision with
          separate correctness, novelty and significance judgments and the exact
          file locations supporting each finding.
        toolFilter:
          deny:
            - subagent
            - subagent_fork
            - research_reviewer
            - workflow
            - send_message
            - list_agents
            - interrupt_agent
            - ask_user_question

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # No `tool-ralph` row. A Ralph round starts a fresh child that sees only a
    # bounded handoff, while this flow runs in one persistent session with the
    # campaign state on disk. The shipped `standard` preset still offers it.

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
